<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>會員申請｜MAARU</title>
    <script>
      (function () {
        var p = window.location.pathname || "";
        if (p && !p.endsWith("/") && p.indexOf(".") === -1) {
          window.location.replace(p + "/" + window.location.search + window.location.hash);
        }
      })();
    </script>
    <base href="./" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --sumi: #1c2430;
        --ink: #2a3544;
        --muted: #6a7585;
        --ai: #3d5a80;
        --ai-deep: #2c4466;
        --mist: #eef3f8;
        --washi: #f7f9fc;
        --line: #06c755;
        --line-deep: #05a848;
        --stroke: rgba(61, 90, 128, 0.16);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        font-family: "Zen Kaku Gothic New", "Noto Sans TC", sans-serif;
        background-color: var(--washi);
        background-image:
          radial-gradient(ellipse 80% 55% at 15% 0%, rgba(61, 90, 128, 0.14), transparent 58%),
          radial-gradient(ellipse 70% 45% at 100% 100%, rgba(120, 160, 190, 0.12), transparent 55%),
          linear-gradient(165deg, #f8fafc 0%, #eef3f8 48%, #f5f7fa 100%),
          url("data:image/svg+xml,%3Csvg width='120' height='104' viewBox='0 0 120 104' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' stroke='%233d5a80' stroke-opacity='0.05' stroke-width='1'%3E%3Cpath d='M0 52c20 0 20-26 40-26s20 26 40 26 20-26 40-26'/%3E%3Cpath d='M0 78c20 0 20-26 40-26s20 26 40 26 20-26 40-26'/%3E%3Cpath d='M0 26c20 0 20-26 40-26s20 26 40 26 20-26 40-26'/%3E%3C/g%3E%3C/svg%3E");
        background-size: auto, auto, auto, 120px 104px;
        overflow-x: hidden;
      }

      .stage {
        position: relative;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: clamp(1.5rem, 5vw, 3rem) 1.25rem 2.5rem;
        max-width: 28rem;
        margin: 0 auto;
      }

      .brand {
        font-family: "Shippori Mincho", serif;
        font-size: clamp(3.1rem, 12vw, 4.2rem);
        font-weight: 700;
        line-height: 0.95;
        letter-spacing: 0.08em;
        color: var(--sumi);
        opacity: 0;
        transform: translateY(14px);
        animation: rise-in 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.08s forwards;
      }

      .brand-kana {
        margin-top: 0.55rem;
        font-size: 0.72rem;
        letter-spacing: 0.42em;
        color: var(--ai);
        font-weight: 500;
        opacity: 0;
        animation: rise-in 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.18s forwards;
      }

      .rule {
        width: 3.5rem;
        height: 1px;
        margin: 1.35rem 0 1.2rem;
        background: linear-gradient(90deg, var(--ai), transparent);
        opacity: 0;
        transform: scaleX(0.4);
        transform-origin: left center;
        animation: rule-in 0.8s ease 0.35s forwards;
      }

      h1 {
        margin: 0;
        font-family: "Shippori Mincho", serif;
        font-size: clamp(1.55rem, 5.5vw, 1.85rem);
        font-weight: 600;
        letter-spacing: 0.12em;
        color: var(--sumi);
        opacity: 0;
        animation: rise-in 0.85s cubic-bezier(0.22, 1, 0.36, 1) 0.28s forwards;
      }

      .lead {
        margin: 0.7rem 0 0;
        max-width: 20rem;
        font-size: 0.92rem;
        line-height: 1.75;
        color: var(--muted);
        font-weight: 400;
        opacity: 0;
        animation: rise-in 0.85s cubic-bezier(0.22, 1, 0.36, 1) 0.38s forwards;
      }

      .actions {
        margin-top: 1.75rem;
        display: grid;
        gap: 0.75rem;
        opacity: 0;
        animation: rise-in 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.48s forwards;
      }

      .btn-line {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-height: 3.15rem;
        padding: 0.85rem 1rem;
        border: 0;
        background: var(--line);
        color: #fff;
        text-decoration: none;
        font-family: inherit;
        font-size: 0.95rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        cursor: pointer;
        transition: background 0.2s ease, transform 0.2s ease, opacity 0.2s ease;
      }

      .btn-line:hover {
        background: var(--line-deep);
        transform: translateY(-1px);
      }

      .btn-line:disabled,
      .btn-line.is-disabled {
        opacity: 0.55;
        pointer-events: none;
        transform: none;
      }

      .btn-shop {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-height: 2.85rem;
        border: 1px solid var(--stroke);
        background: transparent;
        color: var(--ink);
        text-decoration: none;
        font-size: 0.86rem;
        letter-spacing: 0.12em;
        transition: border-color 0.2s ease, color 0.2s ease;
      }

      .btn-shop:hover {
        border-color: rgba(61, 90, 128, 0.4);
        color: var(--ai-deep);
      }

      .foot-note {
        margin-top: 1.6rem;
        font-size: 0.72rem;
        letter-spacing: 0.08em;
        color: var(--muted);
        line-height: 1.7;
        opacity: 0;
        animation: rise-in 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.7s forwards;
      }

      .mist-orb {
        position: fixed;
        width: 18rem;
        height: 18rem;
        border-radius: 50%;
        pointer-events: none;
        filter: blur(40px);
        opacity: 0.35;
        background: rgba(120, 160, 190, 0.35);
        top: -4rem;
        right: -5rem;
        animation: drift 14s ease-in-out infinite alternate;
        z-index: 0;
      }

      .stage > * { position: relative; z-index: 1; }

      @keyframes rise-in {
        to { opacity: 1; transform: none; }
      }

      @keyframes rule-in {
        to { opacity: 1; transform: scaleX(1); }
      }

      @keyframes drift {
        from { transform: translate(0, 0); }
        to { transform: translate(-1.5rem, 1.2rem); }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation: none !important;
          transition: none !important;
          opacity: 1 !important;
          transform: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="mist-orb" aria-hidden="true"></div>
    <main class="stage">
      <div class="brand" id="brandTitle">MAARU SHOP</div>
      <div class="brand-kana" id="brandTag">会員カード</div>
      <div class="rule" aria-hidden="true"></div>
      <h1>會員申請</h1>
      <p class="lead" id="leadText">
        🎉 歡迎加入 MAARU SHOP 會員！<br /><br />
        請點選下方 「申請會員」 按鈕，開啟官方 LINE 後，即可完成會員申請<br /><br />
        送出後系統將自動通知您申請已成功送出，謝謝！
      </p>

      <div class="actions">
        <a id="btnApply" class="btn-line is-disabled" href="#" aria-disabled="true">申請會員</a>
        <a id="btnShop" class="btn-shop" href="./">返回商店</a>
      </div>

    </main>

    <script>
      (function () {
        var API_URL =
          "https://script.google.com/macros/s/AKfycbyyFnwQVNVamiWRD23U4TOIKnR_iHqfO3ObFmFl_lfqepR8tvFgvWvm5YBqxuFWZiaBfw/exec";
        var CORS_PROXY_PREFIX = "https://corsproxy.io/?";
        var brandTitle = document.getElementById("brandTitle");
        var brandTag = document.getElementById("brandTag");
        var btnShop = document.getElementById("btnShop");
        var btnApply = document.getElementById("btnApply");
        var leadText = document.getElementById("leadText");

        function getJson(action) {
          var url = API_URL + "?action=" + encodeURIComponent(action);
          function doFetch(u) {
            return fetch(u, { method: "GET", redirect: "follow", cache: "no-store" }).then(function (r) {
              return r.text().then(function (t) {
                try {
                  return t ? JSON.parse(t) : {};
                } catch (e) {
                  return {};
                }
              });
            });
          }
          return doFetch(url).catch(function () {
            return doFetch(CORS_PROXY_PREFIX + encodeURIComponent(url));
          });
        }

        function setApplyUrl(url) {
          if (!btnApply) return;
          if (url && /^https:\/\//i.test(url)) {
            btnApply.href = url;
            btnApply.classList.remove("is-disabled");
            btnApply.removeAttribute("aria-disabled");
            return;
          }
          btnApply.href = "#";
          btnApply.classList.add("is-disabled");
          btnApply.setAttribute("aria-disabled", "true");
          if (leadText) {
            leadText.textContent = "目前無法開啟官方 LINE，請稍後再試或聯絡店家。";
          }
        }

        getJson("line_bind_config")
          .then(function (cfg) {
            var publicSiteUrl = String((cfg && cfg.publicSiteUrl) || "").trim();
            var applyMemberUrl = String((cfg && cfg.applyMemberUrl) || "").trim();
            if (brandTitle) brandTitle.textContent = "MAARU SHOP";
            if (brandTag) brandTag.textContent = "会員カード";
            document.title = "會員申請｜MAARU SHOP";
            if (btnShop) {
              btnShop.href = publicSiteUrl ? publicSiteUrl.replace(/\/$/, "") + "/" : "./";
            }
            setApplyUrl(applyMemberUrl);
          })
          .catch(function () {
            setApplyUrl("");
          });
      })();
    </script>
  </body>
</html>
