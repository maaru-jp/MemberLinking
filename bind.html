<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>會員綁定｜MemberLinking</title>
    <script>
      (function () {
        var p = window.location.pathname || "";
        if (p && !p.endsWith("/") && p.indexOf(".") === -1) {
          window.location.replace(p + "/" + window.location.search + window.location.hash);
        }
      })();
    </script>
    <base href="./" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Noto+Sans+TC:wght@400;500;600;700&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root {
        --bind-ink: #2f3a32;
        --bind-muted: #6b756e;
        --bind-line: #06c755;
        --bind-line-deep: #05a848;
        --bind-matcha: #7a9e7e;
        --bind-cream: #f6f1e8;
        --bind-sand: #ebe3d6;
        --bind-amber: #d97706;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        color: var(--bind-ink);
        font-family: "Noto Sans TC", "Zen Maru Gothic", sans-serif;
        background:
          radial-gradient(ellipse 90% 60% at 0% 0%, rgba(122, 158, 126, 0.22), transparent 55%),
          radial-gradient(ellipse 70% 50% at 100% 10%, rgba(232, 168, 124, 0.18), transparent 50%),
          linear-gradient(165deg, #f8f5ef 0%, #eef3ee 45%, #f4efe7 100%);
      }
      .bind-shell {
        max-width: 26rem;
        margin: 0 auto;
        padding: 2rem 1.1rem 3rem;
      }
      .brand-mark {
        font-family: "Instrument Serif", "Zen Maru Gothic", serif;
        font-size: 2.35rem;
        line-height: 1;
        letter-spacing: 0.02em;
        color: var(--bind-ink);
      }
      .brand-sub {
        margin-top: 0.35rem;
        font-size: 0.72rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--bind-matcha);
        font-weight: 600;
      }
      .bind-card {
        margin-top: 1.5rem;
        border-radius: 1.75rem;
        background: rgba(255, 255, 255, 0.82);
        border: 1px solid rgba(122, 158, 126, 0.22);
        box-shadow: 0 18px 50px rgba(47, 58, 50, 0.06);
        backdrop-filter: blur(10px);
        overflow: hidden;
      }
      .bind-card-head {
        padding: 1.35rem 1.35rem 1rem;
        background:
          linear-gradient(135deg, rgba(122, 158, 126, 0.16), transparent 60%),
          linear-gradient(180deg, #fff 0%, rgba(246, 241, 232, 0.65) 100%);
        border-bottom: 1px solid rgba(122, 158, 126, 0.12);
      }
      .bind-card-body { padding: 1.2rem 1.35rem 1.5rem; }
      .step-row {
        display: flex;
        gap: 0.55rem;
        margin: 0.85rem 0 0;
      }
      .step-pill {
        flex: 1;
        text-align: center;
        font-size: 0.68rem;
        font-weight: 600;
        color: var(--bind-muted);
        background: var(--bind-cream);
        border: 1px solid var(--bind-sand);
        border-radius: 999px;
        padding: 0.4rem 0.2rem;
      }
      .step-pill.on {
        color: #fff;
        background: var(--bind-matcha);
        border-color: var(--bind-matcha);
      }
      .status-chip {
        display: none;
        margin-top: 0.9rem;
        border-radius: 0.9rem;
        padding: 0.7rem 0.85rem;
        font-size: 0.82rem;
        line-height: 1.45;
        border: 1px solid transparent;
      }
      .status-chip.show { display: block; }
      .status-chip.info {
        background: #f3f6f3;
        border-color: #d7e3d8;
        color: #445248;
      }
      .status-chip.err {
        background: #fff1f2;
        border-color: #fecdd3;
        color: #9f1239;
      }
      .btn-line {
        width: 100%;
        border: 0;
        border-radius: 999px;
        background: var(--bind-line);
        color: #fff;
        font-weight: 700;
        font-size: 0.95rem;
        padding: 0.95rem 1rem;
        cursor: pointer;
        box-shadow: 0 10px 24px rgba(6, 199, 85, 0.25);
      }
      .btn-line:hover { background: var(--bind-line-deep); }
      .btn-line:disabled { opacity: 0.55; cursor: not-allowed; box-shadow: none; }
      .panel {
        display: none;
        margin-top: 1rem;
        border-radius: 1.25rem;
        padding: 1.15rem 1rem 1.2rem;
      }
      .panel.show { display: block; }
      .panel-otp {
        background: linear-gradient(180deg, #f0f7f1, #fbfaf7);
        border: 1px solid rgba(122, 158, 126, 0.28);
      }
      .otp-label {
        text-align: center;
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--bind-matcha);
        letter-spacing: 0.08em;
      }
      .otp-digit {
        margin: 0.55rem 0 0.85rem;
        text-align: center;
        font-family: "Zen Maru Gothic", "Noto Sans TC", sans-serif;
        font-size: 2.6rem;
        font-weight: 700;
        letter-spacing: 0.28em;
        color: var(--bind-ink);
        font-variant-numeric: tabular-nums;
      }
      .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.55rem; }
      .btn-ghost, .btn-deep, .btn-amber {
        border-radius: 999px;
        font-size: 0.84rem;
        font-weight: 600;
        padding: 0.72rem 0.5rem;
        text-align: center;
        text-decoration: none;
        cursor: pointer;
      }
      .btn-ghost {
        border: 1px solid rgba(122, 158, 126, 0.35);
        background: #fff;
        color: #3d5642;
      }
      .btn-deep {
        border: 0;
        background: #1f6b3a;
        color: #fff;
      }
      .btn-amber {
        width: 100%;
        border: 0;
        background: var(--bind-amber);
        color: #fff;
        box-shadow: 0 10px 22px rgba(217, 119, 6, 0.22);
      }
      .hint {
        margin: 0.75rem 0 0;
        font-size: 0.72rem;
        line-height: 1.55;
        color: var(--bind-muted);
        text-align: center;
      }
      .panel-review {
        text-align: center;
        background: #fffaf3;
        border: 1px solid #f3dfc0;
      }
      .clock-ring {
        width: 3.5rem;
        height: 3.5rem;
        margin: 0.2rem auto 0.85rem;
        border-radius: 999px;
        border: 2px solid #f0b45a;
        display: grid;
        place-items: center;
        color: #d97706;
        font-size: 1.35rem;
      }
      .panel-review h2 {
        margin: 0;
        font-family: "Zen Maru Gothic", sans-serif;
        font-size: 1.45rem;
      }
      .panel-done {
        text-align: center;
        background: #eef7f0;
        border: 1px solid #cfe3d3;
        color: #24553a;
        font-size: 0.9rem;
        line-height: 1.55;
      }
      .foot-link {
        display: block;
        margin-top: 1.1rem;
        text-align: center;
        font-size: 0.82rem;
        color: var(--bind-muted);
        text-decoration: none;
      }
      .foot-link:hover { color: var(--bind-matcha); }
    </style>
  </head>
  <body>
    <main class="bind-shell">
      <header>
        <div class="brand-mark" id="brandTitle">MemberLinking</div>
        <div class="brand-sub" id="brandTag">MAARU · 會員綁定</div>
      </header>

      <section class="bind-card">
        <div class="bind-card-head">
          <h1 style="margin:0;font-size:1.35rem;font-weight:700;">申請會員</h1>
          <p style="margin:0.45rem 0 0;font-size:0.86rem;line-height:1.55;color:var(--bind-muted);">
            無需網頁登入。請到官方 LINE 傳送「申請會員」，系統會立刻回覆 6 碼並進入審核。
          </p>
          <div class="step-row" aria-hidden="true">
            <div class="step-pill on" id="step1">① 傳申請會員</div>
            <div class="step-pill on" id="step2">② 收到 6 碼</div>
            <div class="step-pill on" id="step3">③ 等待審核</div>
          </div>
          <div id="statusBox" class="status-chip show info" role="status">請至官方 LINE 操作</div>
        </div>

        <div class="bind-card-body">
          <div class="panel panel-otp show" style="display:block;">
            <div class="otp-label">在官方帳號對話輸入</div>
            <div class="otp-digit" style="font-size:1.55rem;letter-spacing:0.08em;">申請會員</div>
            <p class="hint" style="margin-top:0.75rem;">
              傳送後會收到 6 碼驗證碼，狀態為「審核中」。商家核准後會以 LINE 通知您。
            </p>
            <div class="btn-row" style="margin-top:1rem;">
              <a id="btnOpenLine" class="btn-line" href="https://line.me/R/ti/p/">開啟官方 LINE</a>
            </div>
          </div>
          <a id="btnShop" class="foot-link" href="./">返回商店</a>
        </div>
      </section>
    </main>

    <script>
      (function () {
        var API_URL =
          "https://script.google.com/macros/s/AKfycbyyFnwQVNVamiWRD23U4TOIKnR_iHqfO3ObFmFl_lfqepR8tvFgvWvm5YBqxuFWZiaBfw/exec";
        var CORS_PROXY_PREFIX = "https://corsproxy.io/?";
        var brandTitle = document.getElementById("brandTitle");
        var brandTag = document.getElementById("brandTag");
        var btnShop = document.getElementById("btnShop");

        function getJson(action) {
          var url = API_URL + "?action=" + encodeURIComponent(action);
          function doFetch(u) {
            return fetch(u, { method: "GET", redirect: "follow", cache: "no-store" }).then(function (r) {
              return r.text().then(function (t) {
                try {
                  return t ? JSON.parse(t) : {};
                } catch (e) {
                  return {};
                }
              });
            });
          }
          return doFetch(url).catch(function () {
            return doFetch(CORS_PROXY_PREFIX + encodeURIComponent(url));
          });
        }

        getJson("line_bind_config")
          .then(function (cfg) {
            var brandName = String((cfg && cfg.brandName) || "MAARU").trim() || "MAARU";
            var projectName = String((cfg && cfg.projectName) || "MemberLinking").trim() || "MemberLinking";
            var publicSiteUrl = String((cfg && cfg.publicSiteUrl) || "").trim();
            if (brandTitle) brandTitle.textContent = projectName;
            if (brandTag) brandTag.textContent = (brandName.split(/\s+/)[0] || "MAARU") + " · 會員申請";
            document.title = "會員申請｜" + projectName;
            if (btnShop) {
              btnShop.href = publicSiteUrl ? publicSiteUrl.replace(/\/$/, "") + "/" : "./";
            }
          })
          .catch(function () {});
      })();
    </script>
  </body>
</html>
